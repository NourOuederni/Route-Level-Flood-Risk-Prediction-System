# One file per expert (hydrologist, civil engineer, civil protection...).
# For each pair "a>b": how much MORE important is factor a than factor b for street flooding?
#   1 = equal, 3 = moderately more, 5 = strongly, 7 = very strongly, 9 = extremely
#   use fractions ("1/3", "1/5") when b is more important than a.
# Then: python -m app.engine.ahp experts/*.yaml --mc 2000
# Copy the printed weights into config/engine.yaml (susceptibility.weights) if CR < 0.10.
expert: "Name / role"
factors: [depression, drainage_position, low_slope, impervious, crossing, past_flood]
pairs:
  depression>drainage_position: 1
  depression>low_slope: 2
  depression>impervious: 2
  depression>crossing: 2
  depression>past_flood: 1
  drainage_position>low_slope: 2
  drainage_position>impervious: 1
  drainage_position>crossing: 2
  drainage_position>past_flood: 1
  low_slope>impervious: 1
  low_slope>crossing: 1
  low_slope>past_flood: "1/2"
  impervious>crossing: 1
  impervious>past_flood: "1/2"
  crossing>past_flood: "1/2"
